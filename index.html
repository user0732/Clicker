<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ejecutar Script: de pasante a IA deidad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
:root{--bg:#0c0a1f;--pn:#15122e;--ln:#2e2a5c;--ink:#e8e6ff;--dim:#8b87c2;--cy:#38e8ff;--mg:#ff3fa4;--am:#ffc13b;--ok:#6dffb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed;color:var(--ink);font:13px/1.45 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
body::before{content:"";position:fixed;inset:0;background:rgba(12,10,31,.86);z-index:-1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;padding:12px;display:grid;gap:12px}
.hd{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:end;justify-content:space-between}
.hd h1{margin:0;font-size:13px;font-weight:400;color:var(--dim)}
.who{display:flex;gap:12px;align-items:center}
#av{width:84px;height:84px;border-radius:10px;object-fit:cover;border:2px solid var(--mg);box-shadow:0 0 0 3px #0a0820,0 0 18px rgba(255,63,164,.45);background:#0a0820;flex:none}
#av.up{animation:pop .7s}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);filter:brightness(2.4)}60%{transform:scale(1.12)}100%{transform:none;filter:none}}
.rank{font-size:20px;font-weight:800;color:var(--mg)}
.big{font-size:clamp(30px,6vw,52px);font-weight:800;color:var(--cy);text-shadow:0 0 22px rgba(56,232,255,.55);line-height:1.1}
.sub{color:var(--dim)}
.bar2{height:6px;background:var(--ln);margin-top:4px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--mg),var(--cy));width:0}
.buffs{min-height:20px;color:var(--am)}.buffs span{margin-right:12px}.buffs .bad{color:var(--mg)}
.cols{display:grid;gap:12px}
@media(min-width:1000px){.cols{grid-template-columns:330px minmax(0,1fr) 390px;align-items:start}}
.win{background:var(--pn);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.win>h2{margin:0;padding:6px 10px;font-size:12px;font-weight:400;color:var(--dim);background:#1d1941;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px}
.win>h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mg);box-shadow:14px 0 var(--am),28px 0 var(--ok);margin-right:34px}
.body{padding:10px;display:grid;gap:8px}
#run{position:relative;width:100%;padding:26px 8px;font-size:20px;font-weight:800;background:#0a0820;border:2px solid var(--cy);border-radius:8px;color:var(--cy);box-shadow:0 0 0 3px #0a0820,0 0 0 5px var(--mg),0 0 26px rgba(255,63,164,.35);user-select:none;-webkit-tap-highlight-color:transparent}
#run:active{transform:translateY(2px) scale(.99);background:#14103a}
.fl{position:fixed;pointer-events:none;color:var(--ok);font-weight:800;animation:up .8s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.it{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;padding:8px 10px;background:#100d26;border:1px solid var(--ln);border-radius:6px;position:relative;overflow:hidden}
.it:not(:disabled):hover{border-color:var(--cy)}
.it:disabled{opacity:.5;cursor:not-allowed}
.it .l{display:grid;gap:2px;min-width:0;flex:1}.it b{color:var(--ink)}.it i{font-style:normal;color:var(--dim);font-size:12px}
.it .r{text-align:right;white-space:nowrap;display:grid;gap:2px}.it em{font-style:normal;color:var(--am);font-weight:700}.it u{text-decoration:none;color:var(--cy)}
.it .cdb{position:absolute;left:0;bottom:0;height:3px;background:var(--mg);width:0}
.it.on{border-color:var(--am);box-shadow:inset 0 0 0 1px var(--am)}
.it .gi{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;border:1px solid var(--ln);align-self:center}
.it.sk .r{white-space:normal;max-width:42%;text-align:right;overflow-wrap:anywhere;align-content:center}
.it.sk .l{overflow-wrap:anywhere}
#lv{display:none;position:fixed;inset:0;z-index:30;background:rgba(6,4,20,.9);align-items:center;justify-content:center;padding:16px}
#lv .win{width:100%;max-width:420px;text-align:center;border-color:var(--mg);box-shadow:0 0 40px rgba(255,63,164,.4)}
#lv img{width:170px;height:170px;border-radius:14px;object-fit:cover;border:3px solid var(--cy);box-shadow:0 0 0 4px #0a0820,0 0 30px rgba(56,232,255,.5);margin:0 auto;animation:pop .8s}
#lv h3{margin:0;color:var(--am);font-size:20px}
#lv .rk{color:var(--mg);font-size:18px;font-weight:800}
#lv .go{background:var(--mg);border:0;color:#fff;padding:14px;border-radius:6px;font-weight:800}
#mg{display:none;position:fixed;inset:0;z-index:25;background:rgba(6,4,20,.8);align-items:center;justify-content:center;padding:16px}
#mg .win{width:100%;max-width:400px;border-color:var(--mg);box-shadow:0 0 40px rgba(255,63,164,.45)}
.tm{height:8px;background:var(--ln)}.tm i{display:block;height:100%;width:100%;background:var(--mg)}
#mgs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;color:var(--dim)}
#mgs span{padding:2px 8px;border:1px solid var(--ln);border-radius:4px;background:#0a0820;font-weight:700}
#mgs span.n{border-color:var(--cy);color:var(--cy)}#mgs span.d{border-color:var(--ok);color:var(--ok)}
#mgg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#mgg button{min-height:64px;padding:4px;background:#100d26;border:1px solid var(--ln);border-radius:6px;font-weight:800;touch-action:manipulation;overflow-wrap:anywhere}
#mgg button.ok{border-color:var(--ok);color:var(--ok);background:#0d2a1c}
#mgg button.bad{border-color:var(--mg);background:#3a0d2a}
.ph{color:var(--mg);padding:4px 2px 0;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 0}
.tabs button,.q button,.sm{background:#100d26;border:1px solid var(--ln);border-radius:5px;padding:4px 8px}
.tabs button.a,.q button.a{border-color:var(--cy);color:var(--cy)}
.q{display:flex;gap:4px;align-items:center;color:var(--dim)}
#log{margin:0;height:130px;overflow:auto;color:var(--ok);font-size:12px;list-style:none;padding:0}
#log li::before{content:"> ";color:var(--mg)}
#th{display:none;border:2px solid var(--mg);background:#2a0d28;border-radius:8px;padding:10px;gap:8px;align-items:center;justify-content:space-between;animation:bl 1s infinite alternate}
@keyframes bl{to{box-shadow:0 0 20px var(--mg)}}
#th button{background:var(--mg);border:0;color:#fff;padding:10px 16px;border-radius:6px;font-weight:800}
.warn{color:var(--am)}
#md{display:none;position:fixed;inset:0;z-index:20;background:rgba(6,4,20,.88);align-items:center;justify-content:center;padding:16px}
#md .win{width:100%;max-width:420px}
#md label{display:grid;gap:4px;color:var(--dim)}
#md input{font:inherit;font-size:16px;color:var(--ink);background:#0a0820;border:1px solid var(--cy);border-radius:6px;padding:10px}
#md .go{background:var(--mg);border:0;color:#fff;padding:12px;border-radius:6px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

function fmt(n){if(n<1e3)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();const s=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];const e=Math.floor(Math.log10(n)/3);if(e>=s.length)return n.toExponential(2).replace("+","");return(n/Math.pow(10,e*3)).toFixed(2)+s[e]}
function load(){try{const j=localStorage.getItem(KEY);if(j)S=Object.assign(def(),JSON.parse(j))}catch(e){}if(!S)S=def()}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const now=()=>Date.now(),act=k=>(S.b[k]||0)>now();
const rank=()=>{let r=0;RT.forEach((t,i)=>{if(S.run>=t)r=i});return r};
const pm=a=>a.reduce((x,i)=>x*i[2],1);
const hwM=()=>S.hw.reduce((a,i)=>a*HW[i][2],1),cpM=()=>S.cp.reduce((a,i)=>a*CP[i][2],1);
function drinkM(){return act("dr")?S.b.drm:1}
function mult(){let m=Math.pow(1.1,rank())*cpM()*(1+.01*S.ppt)*(1+.12*S.pl[2])*drinkM();

const base=()=>S.g.reduce((a,n,i)=>a+n*G[i][3],0);
const cps=()=>base()*mult();
function clickV(){return(hwM()+cps()*.01)*(1+.3*S.pl[0])*(act("cf")?5:1)}
function add(x){S.f+=x;S.run+=x;S.life+=x}
const disc=()=>Math.pow(.96,S.pl[1]);
const bulk=(i,k)=>G[i][2]*Math.pow(R,S.g[i])*(Math.pow(R,k)-1)/(R-1)*disc();
const maxK=i=>Math.max(0,Math.floor(Math.log(1+S.f*(R-1)/(G[i][2]*Math.pow(R,S.g[i])*disc()))/Math.log(R)));
const kFor=i=>Q==="max"?Math.max(1,maxK(i)):Q;

function fl(x,y,t){const e=document.createElement("div");e.className="fl";e.textContent=t;e.style.left=x+"px";e.style.top=y+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),800)}
function mkItem(par,o){const b=document.createElement("button");b.className="it"+(o.cls?" "+o.cls:"");b.innerHTML='<span class="l"><b></b><i></i></span><span class="r"><em></em><u></u></span><span class="cdb"></span>';
 if(o.img){const m=document.createElement("img");m.className="gi";m.src=o.img;m.alt="";m.width=52;m.height=52;b.insertBefore(m,b.firstChild)}b.querySelector("b").textContent=o.t;b.querySelector("i").textContent=o.d;b.onclick=o.go;par.appendChild(b);
 return{el:b,b:b.querySelector("b"),i:b.querySelector("i"),em:b.querySelector("em"),u:b.querySelector("u"),cb:b.querySelector(".cdb"),o}}
let GI=[],SI=[],KI=[];
function buildGen(){const p=$("gn");p.innerHTML="";GI=[];G.forEach((g,i)=>{
 let h=null;if(PH[i]){h=document.createElement("div");h.className="ph";h.textContent=PH[i];p.appendChild(h)}
 const it=mkItem(p,{t:g[0],d:g[1],img:GA[i],go(){const k=kFor(i),c=bulk(i,k);if(S.f>=c){S.f-=c;S.g[i]+=k}}});it.h=h;it.i2=i;GI.push(it)})}
function buildSk(){const p=$("sk");p.innerHTML="";KI=SK.map((s,i)=>mkItem(p,{t:s[0],d:s[1],img:SA[i],cls:"sk",go(){useSk(i)}}))}
function useSk(i){const s=SK[i],n=now();if(rank()<s[3]||(S.cd[i]||0)>n)return;
 S.cd[i]=n+s[2]*1000*Math.pow(.97,S.pl[4]);
 if(i==0){S.b.cf=n+15e3;log("Frenesí de Cafeína: las manos vuelan.")}
 if(i==1){const g=Math.max(cps()*90,clickV()*100);add(g);log("Copiaste de Stack Overflow: +"+fmt(g)+" FLOPS.")}
 if(i==2){S.b.cr=n+3e4;S.b.sl=n+4e4;log("Crunch Time: producción x2.")}
 if(i==3){if(Math.random()<.8){const g=cps()*400+clickV()*200;add(g);log("Deploy del viernes salió bien: +"+fmt(g)+" FLOPS.")}else{S.b.bug=n+6e4;log("Deploy del viernes rompió todo. Producción caída 1 minuto.")}}
 if(i==4){S.b.au=n+1e4;log("Script oculto ejecutándose.")}
 if(i==5){S.b.hd=n+2e4;T=null;nt=n+6e4;log("Hard Reset: sistema limpio.")}}
function tabs(){$("tabs").innerHTML="";[["hw","Hardware"],["dr","Bebidas"],["cp","Código"],["pr","Prestigio"]].forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.className=TAB==k?"a":"";b.onclick=()=>{TAB=k;shop();tabs()};$("tabs").appendChild(b)})}
function shop(){const p=$("shop");p.innerHTML="";SI=[];
 if(TAB=="hw")HW.forEach((h,i)=>{if(S.hw.includes(i))return;SI.push(Object.assign(mkItem(p,{t:h[0],d:"Valor del clic x"+h[2],img:HA[i],go(){if(S.f>=h[1]){S.f-=h[1];S.hw.push(i);shop()}}}),{c:()=>h[1]}))});
 if(TAB=="cp")CP.forEach((h,i)=>{if(S.cp.includes(i))return;SI.push(Object.assign(mkItem(p,{t:h[0],d:"Producción global x"+h[2],img:CA[i],go(){if(S.f>=h[1]){S.f-=h[1];S.cp.push(i);shop()}}}),{c:()=>h[1]}))});
 if(TAB=="dr")DR.forEach((h,i)=>{if(rank()<h[4])return;const c=()=>Math.max(h[1],cps()*(h[2]-1)*h[3]*.5);
  SI.push(Object.assign(mkItem(p,{t:h[0],d:"Producción x"+h[2]+" por "+h[3]+"s",img:DA[i],go(){const x=c();if(S.f>=x&&(!act("dr")||h[2]>=S.b.drm)){S.f-=x;S.b.dr=now()+h[3]*1e3;S.b.drm=h[2];log("Consumiste: "+h[0]+".")}}}),{c}))});
 if(TAB=="pr"){const d=document.createElement("div");d.className="sub";d.id="prn";p.appendChild(d);
  const pb=document.createElement("button");pb.className="it";pb.style.justifyContent="center";pb.id="pbtn";pb.onclick=()=>{const g=ppG();if(g<1)return;if(!armed.p){armed.p=1;pb.textContent="Tocá otra vez para confirmar";setTimeout(()=>{armed.p=0},4e3);return}
   armed.p=0;const k=S.pl.slice();S.pp+=g;S.ppt+=g;S.pres++;Object.assign(S,{f:0,run:0,g:G.map(_=>0),hw:[],cp:[],b:{},cd:{}});T=null;cur=0;log("Renunciaste a "+S.co+". +"+g+" puntos de prestigio.");buildGen();buildSk();shop();ask()};p.appendChild(pb);
  PR.forEach((h,i)=>{const c=()=>Math.ceil(h[2]*Math.pow(1.5,S.pl[i]));SI.push(Object.assign(mkItem(p,{t:h[0],d:h[1],go(){if(S.pl[i]<MAXL&&S.pp>=c()){S.pp-=c();S.pl[i]++}}}),{c,pr:i}))});
  const r=document.createElement("button");r.className="sm";r.textContent="Borrar partida";r.onclick=()=>{if(!armed.r){armed.r=1;r.textContent="Tocá otra vez para borrar todo";setTimeout(()=>{armed.r=0;r.textContent="Borrar partida"},4e3);return}try{localStorage.removeItem(KEY)}catch(e){}S=def();T=null;buildGen();buildSk();tabs();shop();ask()};p.appendChild(r)}}
const ppG=()=>Math.floor(Math.pow(S.run/1e8,.45)*(1+.1*S.pl[3]));
const THS=[];
const LB=[["NPE","404","500","undef","NaN","null","segv","TypeErr","OOM"],["80","443","22","3306","8080","53","21","25","110"],[".enc",".lock",".pdf",".xls",".doc",".sql",".zip",".exe",".dll"],["AKIA","sk-","ghp_","token","env","pem","pwd","ssh","api"],["us-e-1","us-w-2","eu-w-1","sa-e-1","ap-s-1","ca-c-1","eu-c-1","af-s-1","me-s-1"]];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function spawnT(n){const i=Math.floor(Math.random()*TH.length),lb=shuf(LB[i]),len=rank()>=8?5:4,seq=shuf([0,1,2,3,4,5,6,7,8]).slice(0,len);
 T={i,seq,pos:0,exp:n+5000};log("¡Amenaza! "+TH[i][0]);
 $("mgn").textContent=TH[i][0];$("mgd").textContent=TH[i][1]+" Tocá en este orden antes de que se acabe el tiempo:";
 $("mgs").innerHTML=seq.map(x=>"<span>"+lb[x]+"</span>").join(" → ");
 const g=$("mgg");g.innerHTML="";lb.forEach((t,x)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>hit(x,b);g.appendChild(b)});paint()}
function paint(){if(!T)return;document.querySelectorAll("#mgs span").forEach((e,k)=>e.className=k<T.pos?"d":k==T.pos?"n":"")}
function hit(x,b){if(!T)return;if(x===T.seq[T.pos]){b.classList.add("ok");T.pos++;paint();
  if(T.pos>=T.seq.length){const g=cps()*30+clickV()*20;add(g);log("Amenaza resuelta: +"+fmt(g)+" FLOPS de bonus.");T=null;nt=now()+9e4+Math.random()*9e4}}
 else{T.pos=0;document.querySelectorAll("#mgg button").forEach(e=>e.classList.remove("ok"));b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),250);paint()}}
function pause(){if(!paused){paused=true;ps=now()}}
function resume(){const d=now()-ps;for(const k in S.b)if(k!=="drm")S.b[k]+=d;for(const k in S.cd)S.cd[k]+=d;if(nt)nt+=d;if(T)T.exp+=d;paused=false;last=now()}
function levelUp(r){pause();$("lvt").textContent="¡Felicitaciones, "+S.emp+"!";$("lvi").src=AV[r];$("lvr").textContent=RK[r];
 $("lvd").textContent="Tu esfuerzo en "+S.co+" fue reconocido. Te ascendieron.";$("lv").style.display="flex";setTimeout(()=>$("lvb").focus(),50)}
$("lvb").onclick=()=>{$("lv").style.display="none";resume()};
function tick(){if(paused){last=now();return}const n=now(),dt=Math.min(3600,(n-last)/1000);last=n;const c=cps();add(c*dt);
 if(act("au"))add(clickV()*30*dt);
 const r=rank();if(r>(cur)){cur=r;log("¡Ascenso! Ahora sos: "+RK[r]+".");if(TAB=="dr")shop();levelUp(r)}
 if(!T&&!paused&&r>=1&&n>nt){if(nt)spawnT(n);else nt=n+6e4+Math.random()*6e4}
 if(T&&n>T.exp){S.b.pen=n+6e4;log("Se acabó el tiempo con "+TH[T.i][0]+": producción a la mitad por 1 minuto.");T=null;nt=n+9e4+Math.random()*9e4}
 ui(c,r)}
function ui(c,r){$("fl").textContent=fmt(S.f);$("cps").textContent=fmt(c);$("cv").textContent=fmt(clickV());
 $("rk").textContent=RK[r];if(avI!==r){const a=$("av");a.src=AV[r];a.classList.remove("up");void a.offsetWidth;if(avI>=0)a.classList.add("up");avI=r}$("who").textContent=S.emp&&S.co?S.emp+" @ "+S.co:"";const nx=RT[r+1];$("rkb").style.width=nx?Math.min(100,(S.run-RT[r])/(nx-RT[r])*100)+"%":"100%";
 $("rkn").textContent=nx?"Próximo ascenso: "+RK[r+1]+" ("+fmt(nx)+" FLOPS en esta carrera)":"Cargo máximo alcanzado. Podés cambiar de empresa.";
 const bs=[["cf","Frenesí"],["cr","Crunch x2"],["sl","Lentitud -20%",1],["dr","Bebida x"+S.b.drm],["au","Autoclics"],["hd","Hard Reset x1.5"],["bug","Bug: sin producción",1],["pen","Amenaza: -50%",1]];
 $("bf").innerHTML=bs.filter(x=>act(x[0])).map(x=>'<span class="'+(x[2]?"bad":"")+'">'+x[1]+" "+Math.ceil((S.b[x[0]]-now())/1000)+"s</span>").join("");
 $("mg").style.display=T?"flex":"none";if(T)$("mgt").style.width=Math.max(0,(T.exp-now())/50)+"%";
 GI.forEach(g=>{const i=g.i2,k=kFor(i),cst=bulk(i,k),vis=i==0||S.g[i-1]>0||S.g[i]>0||S.run>=G[i][2]*.5;
  g.el.style.display=vis?"":"none";if(g.h)g.h.style.display=vis?"":"none";
  g.el.disabled=S.f<cst;g.em.textContent=fmt(cst)+" (x"+k+")";g.u.textContent="Tenés "+S.g[i]+" | "+fmt(G[i][3]*mult())+"/s c/u"});
 KI.forEach((k,i)=>{const s=SK[i],n=now(),cd=Math.max(0,(S.cd[i]||0)-n),lk=r<s[3];
  k.el.disabled=lk||cd>0;k.u.textContent=lk?"Requiere: "+RK[s[3]]:cd>0?Math.ceil(cd/1000)+"s":"Listo";k.em.textContent="";
  k.cb.style.width=cd>0?(cd/(s[2]*1000*Math.pow(.97,S.pl[4])))*100+"%":"0"});
 SI.forEach(s=>{if(s.pr!==undefined){const l=S.pl[s.pr];s.b.textContent=PR[s.pr][0]+" (nivel "+l+")";s.el.disabled=l>=MAXL||S.pp<s.c();s.em.textContent=l>=MAXL?"Máximo":s.c()+" pts"}
  else{const x=s.c();s.el.disabled=S.f<x;s.em.textContent=fmt(x)}});
 if(TAB=="pr"){const g=ppG();$("prn").textContent="Puntos disponibles: "+S.pp+" | Bonus global: +"+S.ppt+"% | Cambios de empresa: "+S.pres;
  $("pbtn").textContent=armed.p?"Tocá otra vez para confirmar":g>=1?"Cambiar de empresa: +"+g+" pts (reinicia FLOPS, generadores y mejoras)":"Cambiar de empresa (necesitás ~100M FLOPS en esta carrera)";$("pbtn").disabled=g<1}}
$("run").onclick=e=>{const v=clickV();add(v);S.n++;if(e.clientX!=null)fl(e.clientX-8,e.clientY-20,"+"+fmt(v))};
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{Q=b.dataset.q==="max"?"max":+b.dataset.q;document.querySelectorAll("[data-q]").forEach(x=>x.classList.toggle("a",x==b))});
load();cur=rank();
const off=Math.min(8*3600,(now()-S.t)/1000);if(off>60&&base()>0){const g=cps()*off*.5;add(g);setTimeout(()=>log("Mientras no estabas: +"+fmt(g)+" FLOPS (50% en modo offline)."),0)}
buildGen();buildSk();tabs();shop();
function ask(){const first=!S.emp;pause();$("md").style.display="flex";$("mdt").textContent=first?"Alta de empleado":"Nueva empresa";
 $("mdi").textContent=first?"Sos pasante no remunerado. Decinos cómo te llamás y dónde arrancás.":"Cambiaste de trabajo. Poné el nombre de la nueva empresa.";
 $("el").style.display=first?"":"none";$("emp").value=S.emp;$("co").value="";$("mde").textContent="";setTimeout(()=>$(first?"emp":"co").focus(),50)}
function okName(){const e=(S.emp||$("emp").value).trim(),c=$("co").value.trim();
 if(!e||!c){$("mde").textContent="Completá "+(!e?"el nombre del empleado":"el nombre de la empresa")+".";return}
 const first=!S.emp;S.emp=e;S.co=c;resume();nt=0;$("md").style.display="none";save();
 log(first?"Bienvenido, "+e+". Empezás como pasante en "+c+". Ejecutá el script.":e+" empieza a trabajar en "+c+".")}
$("mdg").onclick=okName;$("md").onkeydown=e=>{if(e.key==="Enter")okName()};
if(!S.emp||!S.co){S.emp=S.emp||"";ask()}
last=now();setInterval(tick,100);setInterval(save,10000);
addEventListener("beforeunload",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
</script></body></html>
